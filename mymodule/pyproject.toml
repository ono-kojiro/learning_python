[project]
name = "mymodule"
version = "0.0.1"
description = "python3 module example"

authors = [
    { name = "Kojiro", email = "ono.kojiro@gmail.com" }
]

readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
]

[project.scripts]
amcli = "amcli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


